spring:
  # PostgreSQL for production (e.g. Supabase / Render / Railway).
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vidyapeet}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema is owned by Flyway; never let Hibernate mutate it in prod.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true

vidyapeet:
  seed:
    enabled: ${VIDYAPEET_SEED_ENABLED:false}

# Expose only the health endpoint; keep everything else off in production.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
